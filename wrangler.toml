name = "katterjokk-monitor"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Gör att schema.sql kan importeras som text och köras av Worker:n själv.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[triggers]
# var 5:e minut: poll + larm. 03:17: städning av rader > RETENTION_DAYS.
crons = ["*/5 * * * *", "17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "katterjokk-monitor"
database_id = "ac74d195-fada-4f35-b927-f20fc93c40a1"

[vars]
# Identiteter – öppna https://<worker>.workers.dev/setup så listas de (sidan är aktiv tills NET_SITE_ID är satt)
HOST_ID = "6C63F8328EC90000000008F45C8300000000096EC9F00000000067F62E7C"            # Site Manager host id, GET https://api.ui.com/v1/hosts
SM_SITE_ID = "69922ffe44486445abe89d45"         # siteId, GET https://api.ui.com/v1/sites
NET_SITE_ID = "88f7af54-98f8-306a-a1c7-c9349722b1f6"        # id, connector .../network/integration/v1/sites
GUEST_NETWORK_ID = "1fd7de89-a176-48d6-bbf6-e7a0e8271019"   # id för VLAN 30-nätet, .../networks
GUEST_SUBNET = "192.168.30."
# Failover-detektion (två oberoende signaler, båda valfria):
#  - BACKUP_ISP_MATCH: delsträng i isp-metrics ispName som betyder "5G aktiv", t.ex. "Telia Mobile"
#  - FIBER_ASN: fiberns AS-nummer; larm när ispAsn ≠ detta. Lämna tomt om fibern också är Telia (AS3301).
#  - FIBER_IP_PREFIX: början på fiberns publika IP (konsolens IP sett från molnet). Byter konsolen IP till
#    något utanför prefixet går trafiken via 5G. Mest robust av de tre.
BACKUP_ISP_MATCH = "Telia Mobile"
FIBER_ASN = ""
FIBER_IP_PREFIX = "5.250."
# Vilken WAN UniFi:s isp-metrics mäter. UniFi rapporterar WAN1, inte aktiv WAN. Visas i dashboarden.
ISP_METRICS_WAN = "WAN1 – Telia 5G (backup)"
AP_MODEL_PREFIX = "U7"  # vilka devices som räknas som AP

# Trösklar
THRESH_LOSS_PCT = "5"
THRESH_LATENCY_MS = "100"
THRESH_RETRIES_PCT = "20"
THRESH_DHCP_PCT = "80"
SKEW_FACTOR = "2.5"
SKEW_MIN_CLIENTS = "25"
RETENTION_DAYS = "90"

# Secrets (aldrig här, sätts med `wrangler secret put`):
#   UNIFI_API_KEY   – Site Manager API-nyckel från konsolens ägarkonto
#   ALERT_WEBHOOK   – t.ex. https://ntfy.sh/<hemligt-topic>
