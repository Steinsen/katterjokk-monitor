# Deployar Worker:n till Cloudflare vid varje push till main (och manuellt).
# Kräver repo-secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, UNIFI_API_KEY, ALERT_WEBHOOK (valfri).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Kontrollera att wrangler.toml är ifylld
        run: |
          if grep -q 'REPLACE_WITH_OUTPUT_OF_wrangler_d1_create' wrangler.toml; then
            echo "::error::database_id saknas i wrangler.toml – skapa D1-databasen (Discover-workflow eller dashboarden) och fyll i id:t."
            exit 1
          fi
          for v in HOST_ID SM_SITE_ID NET_SITE_ID; do
            if grep -Eq "^$v = \"\"" wrangler.toml; then
              echo "::error::$v är tomt i wrangler.toml – kör Discover-workflowen och fyll i."
              exit 1
            fi
          done

      - name: Skapa/uppdatera D1-schema
        run: npx wrangler d1 execute katterjokk-monitor --remote --file schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sätt secrets på Worker:n
        env:
          UNIFI_API_KEY: ${{ secrets.UNIFI_API_KEY }}
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          if [ -z "$UNIFI_API_KEY" ]; then echo "::error::Repo-secret UNIFI_API_KEY saknas"; exit 1; fi
          printf '%s' "$UNIFI_API_KEY" | npx wrangler secret put UNIFI_API_KEY
          if [ -n "$ALERT_WEBHOOK" ]; then
            printf '%s' "$ALERT_WEBHOOK" | npx wrangler secret put ALERT_WEBHOOK
          else
            echo "::warning::ALERT_WEBHOOK saknas – larm loggas bara, ingen notis skickas."
          fi

      - name: Dashboard-adress
        run: |
          echo "Dashboarden finns på https://katterjokk-monitor.<ditt-subdomän>.workers.dev"
          echo "(exakt adress: Cloudflare-dashboarden → Workers & Pages → katterjokk-monitor). Första mätningen kommer inom 5 minuter."
